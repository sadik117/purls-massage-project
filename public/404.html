<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Purls-Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Purls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: 'Poppins', sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }
      .glow-orb {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(14,165,233,0.22) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: pulse 6s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
      }
      .title-404 {
        font-size: clamp(5rem, 14vw, 9rem);
        font-weight: 900;
        line-height: 1;
        position: relative;
        color: #ffffff;
        text-shadow: 0 0 50px rgba(14,165,233,0.6);
        letter-spacing: -0.02em;
      }
      .divider {
        height: 2px;
        width: 150px;
        background: linear-gradient(90deg, transparent, #0ea5e9, transparent);
        margin: 1rem 0;
      }
      .heading {
        font-size: clamp(1.3rem, 3.5vw, 2rem);
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .subtext {
        color: #94a3b8;
        font-size: 0.9rem;
        max-width: 380px;
        text-align: center;
        line-height: 1.7;
        margin-bottom: 1.5rem;
      }
      .btn-home {
        display: inline-block;
        padding: 0.85rem 2.2rem;
        background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border-radius: 4px;
        box-shadow: 0 0 25px rgba(14,165,233,0.35);
        transition: all 0.3s ease;
      }
      .btn-home:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 0 40px rgba(14,165,233,0.6);
      }
      .branding {
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(14,165,233,0.5);
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="glow-orb"></div>
    <div class="title-404">404</div>
    <div class="divider"></div>
    <h1 class="heading">Page Not Found</h1>
    <p class="subtext">
      Oops! The page you're looking for doesn't exist or has been moved. Let's get you back home.
    </p>
    <a href="/" class="btn-home">← Back to Home</a>
    <div class="branding">Purls · Massage · Fitness · Beauty</div>
  </body>
</html>
